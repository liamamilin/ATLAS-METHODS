<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Skill 资料库 · Atlas Methods</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Atlas Methods 首页"><i aria-hidden="true"></i>Atlas Methods</a>
    <span class="timestamp" id="updated">正在读取本机目录</span>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <nav aria-label="领域与二级分类" id="category-nav"></nav>
    </aside>
    <main>
      <div class="intro">
        <h1>Skill 资料库</h1>
        <p>按用途找做法，查看步骤与限制，回到固定版本的来源。</p>
        <dl class="metrics" id="metrics" aria-label="目录统计"></dl>
      </div>
      <form class="search" id="search-form" role="search">
        <label class="sr-only" for="query">搜索 Skill</label>
        <input id="query" name="q" type="search" placeholder="搜索名称、用途或仓库…" autocomplete="off" maxlength="160">
        <button type="submit" class="primary">搜索</button>
      </form>
      <div class="filters">
        <label class="mobile-category"><span>领域</span><select id="category-select"><option value="">全部 Skill</option></select></label>
        <label hidden><span>二级分类</span><select id="topic"><option value="">全部二级分类</option></select></label>
        <label hidden><span>做什么</span><select id="action"><option value="">全部任务</option></select></label>
        <label hidden><span>适用工具</span><select id="tool"><option value="">全部工具</option></select></label>
        <label><span>来源</span><select id="repo"><option value="">全部仓库</option></select></label>
        <label><span>排序</span><select id="sort">
          <option value="">相关度</option><option value="new">最近转换</option>
          <option value="title">标题</option><option value="sources">来源最多</option>
        </select></label>
        <label class="check"><input id="grouped" type="checkbox">仅看有多个来源</label>
        <label><span>标签维</span><select id="edim"><option value="">不按标签维</option></select></label>
        <label><span>标签状态</span><select id="estate"><option value="">任意状态</option></select></label>
        <label><span>标签值</span><input id="evalue" maxlength="80" placeholder="已审规范值，含提及"></label>
        <label><span>值角色</span><select id="erole">
          <option value="">已审的任意角色</option>
          <option value="required">仅必需或条件</option>
          <option value="legacy">仅旧任务标签</option>
        </select></label>
        <label><span>第二维</span><select id="edim2"><option value="">不交叉</option></select></label>
        <label><span>第二值</span><input id="evalue2" maxlength="80"></label>
        <label class="check"><input id="esame" type="checkbox" checked>同一任务内</label>
        <button class="clear" id="clear" type="button" hidden>清除筛选</button>
      </div>
      <section aria-label="搜索结果">
        <div class="results-head">
          <h2 id="result-title">全部 Skill</h2>
          <span id="result-count" role="status" aria-live="polite"></span>
        </div>
        <div id="results" class="cards" aria-busy="true"></div>
        <div id="pagination" class="pagination" hidden>
          <button id="previous" type="button">上一页</button>
          <span id="page-info"></span>
          <button id="next" type="button">下一页</button>
        </div>
      </section>
    </main>
  </div>
  <dialog id="detail" aria-labelledby="detail-title">
    <header class="dialog-bar">
      <span>Skill 详情</span>
      <button id="close-detail" type="button" autofocus>关闭</button>
    </header>
    <div id="detail-content" class="dialog-content"><h2 id="detail-title">正在读取</h2></div>
  </dialog>
</body>
</html>
